# ============================================================
# StudyCoach 应用层编排（后端 + 前端 + 入口 Nginx）
#
# 部署（与基础设施合并生效）:
#   cp ops/.env.example .env    # 可选：注入密码 / AI 密钥 / JWT 等
#   docker compose -f docker-compose.yml -f docker-compose.online.yml up -d --build
#
# 说明:
#   - 基础设施服务定义在 docker-compose.yml，通过多文件合并机制叠加，
#     替代旧的 extends 写法（compose v2 推荐）。
#   - backend 容器健康检查由镜像内置 HEALTHCHECK 提供(:18000/healthz)。
#   - .env 通过 env_file 可选注入容器环境变量（backend 配置模板中的
#     ${VAR:-default} 占位符会优先读取同名环境变量）。
# ============================================================

services:
  # 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: manifest/docker/Dockerfile
    container_name: studycoach-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./backend/files:/app/files      # 上传文件持久化
      - ./backend/log:/app/log          # 应用日志
      - ./backend/data:/app/data        # 会话历史等本地数据
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      seaweedfs-filer:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - studycoach-network

  # 前端 Web 服务（SPA 静态资源）
  frontend:
    build:
      context: ./frontChat
      dockerfile: Dockerfile
      args:
        # 相对路径走同源入口 nginx 转发，避免硬编码域名/端口
        - VITE_API_BASE_URL=/gateway
    container_name: studycoach-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - studycoach-network

  # 入口 Nginx：唯一对外端口，反代前端与后端
  nginx:
    image: nginx:1.27-alpine
    container_name: studycoach-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - studycoach-network

networks:
  studycoach-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
