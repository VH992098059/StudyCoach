# ============================================================
# StudyCoach 入口 Nginx（挂载到 nginx 容器 /etc/nginx/conf.d/default.conf）
# 链路: 浏览器 -> 入口 nginx(:80)
#        -> /gateway/*  -> backend 容器(:18000)  [API / SSE 流式 / WebSocket]
#        -> /*          -> frontend 容器(:80)     [SPA 静态资源]
# ============================================================

# WebSocket 升级连接头（/gateway/ws 任务通知）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 上传文件（图片 / 学习文档）上限
    client_max_body_size 100m;

    # 后端：保留 /gateway 前缀原样转发（后端按该前缀注册路由）
    location /gateway/ {
        proxy_pass http://studycoach-backend:18000;
        proxy_http_version 1.1;

        # WebSocket（/gateway/ws）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 打字机流式回答：必须禁缓冲，否则前端收不到增量 chunk
        proxy_buffering off;
        proxy_cache off;

        # 长连接场景（SSE 长回答 / WS 保活）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前端 SPA：静态资源 + React Router 兜底由 frontend 容器内 nginx 处理
    location / {
        proxy_pass http://studycoach-frontend:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
